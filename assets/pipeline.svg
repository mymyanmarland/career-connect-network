<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a66c2"/><stop offset="1" stop-color="#2f80ed"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cd6"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a7a42"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7791f"/><stop offset="1" stop-color="#f5b942"/>
    </linearGradient>
    <style>
      .flow { stroke-dasharray: 10 10; animation: flw 1s linear infinite; }
      @keyframes flw { to { stroke-dashoffset: -20; } }
      .nd { transform-box: fill-box; transform-origin: center; animation: ndp 3s ease-in-out infinite; }
      .nd2 { animation-delay: -.75s; } .nd3 { animation-delay: -1.5s; } .nd4 { animation-delay: -2.25s; }
      @keyframes ndp { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
  </defs>

  <!-- connectors -->
  <line x1="270" y1="120" x2="390" y2="120" stroke="#0a66c2" stroke-width="4" class="flow"/>
  <line x1="570" y1="120" x2="690" y2="120" stroke="#0a66c2" stroke-width="4" class="flow"/>
  <line x1="870" y1="120" x2="990" y2="120" stroke="#0a66c2" stroke-width="4" class="flow"/>

  <!-- packets traveling (SMIL = reliable inside README images) -->
  <path id="p1" d="M270 120 L390 120" fill="none"/>
  <path id="p2" d="M570 120 L690 120" fill="none"/>
  <path id="p3" d="M870 120 L990 120" fill="none"/>
  <circle r="9" fill="#ffd76a" stroke="#fff" stroke-width="2">
    <animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
  </circle>
  <circle r="9" fill="#ffd76a" stroke="#fff" stroke-width="2">
    <animateMotion dur="1.2s" begin="-.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
  </circle>
  <circle r="9" fill="#ffd76a" stroke="#fff" stroke-width="2">
    <animateMotion dur="1.2s" begin="-.8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion>
  </circle>

  <!-- nodes -->
  <g class="nd">
    <rect x="60" y="55" width="210" height="130" rx="20" fill="url(#nb)"/>
    <text x="165" y="108" text-anchor="middle" font-size="44">📡</text>
    <text x="165" y="142" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">FETCH</text>
    <text x="165" y="164" text-anchor="middle" font-size="14" fill="rgba(255,255,255,.85)">6 sources · every 6h</text>
  </g>
  <g class="nd nd2">
    <rect x="390" y="55" width="180" height="130" rx="20" fill="url(#pb)"/>
    <text x="480" y="108" text-anchor="middle" font-size="44">🚫</text>
    <text x="480" y="142" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">DEDUP</text>
    <text x="480" y="164" text-anchor="middle" font-size="14" fill="rgba(255,255,255,.85)">zero repeats</text>
  </g>
  <g class="nd nd3">
    <rect x="690" y="55" width="180" height="130" rx="20" fill="url(#gb)"/>
    <text x="780" y="108" text-anchor="middle" font-size="44">📮</text>
    <text x="780" y="142" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">PUBLISH</text>
    <text x="780" y="164" text-anchor="middle" font-size="14" fill="rgba(255,255,255,.85)">5 jobs · every 30 min</text>
  </g>
  <g class="nd nd4">
    <rect x="990" y="55" width="180" height="130" rx="20" fill="url(#ob)"/>
    <text x="1080" y="108" text-anchor="middle" font-size="44">🌐</text>
    <text x="1080" y="142" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">DISPLAY</text>
    <text x="1080" y="164" text-anchor="middle" font-size="14" fill="rgba(255,255,255,.85)">bilingual my/en</text>
  </g>
</svg>
